<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smiley Flow Time Zip Maker</title>
<style>
body{font-family:system-ui,sans-serif;background:#0d1b3a;color:#f4efe0;text-align:center;padding:24px}
button{font:inherit;font-weight:700;background:#f0b429;color:#14213d;border:0;border-radius:14px;padding:14px 26px;font-size:1.1rem}
#log{margin-top:18px;text-align:left;font-size:.85rem;opacity:.9;white-space:pre-wrap}
</style></head><body>
<h2>Smiley Flow Time Zip Maker</h2>
<p>Downloads all 24 Fluent 3D clock faces, resizes them to 128x128 WebP and saves one ZIP.</p>
<button id="go">Make ZIP</button>
<div id="log"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const CODES=['1f550', '1f551', '1f552', '1f553', '1f554', '1f555', '1f556', '1f557', '1f558', '1f559', '1f55a', '1f55b', '1f55c', '1f55d', '1f55e', '1f55f', '1f560', '1f561', '1f562', '1f563', '1f564', '1f565', '1f566', '1f567'];
const SIZE=128,log=t=>{document.getElementById('log').textContent+=t+'\n'};
document.getElementById('go').onclick=async()=>{
 document.getElementById('log').textContent='';
 if(!window.JSZip)return log('JSZip failed to load. Check your internet and reload.');
 const zip=new JSZip();let ok=0,bad=[];
 async function one(code){
  try{
   let r;for(const v of [code,code+'-fe0f']){r=await fetch('https://cdn.jsdelivr.net/gh/shuding/fluentui-emoji-unicode/assets/'+v+'_3d.png');if(r.ok)break}
   if(!r.ok)throw new Error(r.status);
   const bmp=await createImageBitmap(await r.blob());
   const c=document.createElement('canvas');c.width=c.height=SIZE;
   c.getContext('2d').drawImage(bmp,0,0,SIZE,SIZE);
   const b=await new Promise(res=>c.toBlob(res,'image/webp',0.9));
   zip.file(code+'.webp',b);ok++;
  }catch(e){bad.push(code)}
 }
 for(let i=0;i<CODES.length;i+=10){await Promise.all(CODES.slice(i,i+10).map(one));log('Progress '+Math.min(i+10,CODES.length)+'/'+CODES.length)}
 if(!ok)return log('Nothing downloaded.');
 const blob=await zip.generateAsync({type:'blob'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='smiley-flow-time.zip';a.click();
 log('\nDone: '+ok+'/'+CODES.length+' saved in smiley-flow-time.zip'+(bad.length?'\nMissing: '+bad.join(' '):''));
};
</script></body></html>
